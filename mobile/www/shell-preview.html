<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Nooc — App preview (same as mobile web)</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #171717;
        font-family: system-ui, -apple-system, sans-serif;
        color: #e5e5e5;
        padding: 1.5rem 1rem;
      }
      .note {
        max-width: 390px;
        text-align: center;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.7);
      }
      .note strong {
        color: #fff;
      }
      .phone {
        width: min(100%, 390px);
        height: 780px;
        border-radius: 42px;
        background: #000;
        padding: 12px;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.45);
        position: relative;
      }
      .notch {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 28px;
        background: #000;
        border-radius: 20px;
        z-index: 5;
        pointer-events: none;
      }
      .screen {
        height: 100%;
        border-radius: 30px;
        overflow: hidden;
        background: #faf8f5;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #faf8f5;
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.45);
        text-align: center;
        max-width: 390px;
      }
    </style>
  </head>
  <body>
    <div>
      <p class="note">
        <strong>Same UI as the mobile website.</strong><br />
        The Capacitor app WebView loads this URL — no separate design.
      </p>
      <div class="phone" aria-label="Nooc app preview">
        <div class="notch"></div>
        <div class="screen">
          <iframe
            id="app-frame"
            title="Nooc mobile website"
            src="about:blank"
          ></iframe>
        </div>
      </div>
      <p class="hint">
        Pass <code>?src=</code> with your local or production Nooc URL, or open
        the live mobile site on a phone — that is the app UI.
      </p>
    </div>
    <script>
      ;(function () {
        var frame = document.getElementById("app-frame")
        var params = new URLSearchParams(window.location.search)
        var src = params.get("src")
        if (src) {
          frame.src = src
          return
        }
        // Default: production mobile website (identical UI). For local QA:
        // shell-preview.html?src=http://127.0.0.1:3000/
        frame.src = "https://nooc.io/"
      })()
    </script>
  </body>
</html>
